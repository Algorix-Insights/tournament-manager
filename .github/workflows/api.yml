name: API

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/api.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate API workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build API workspace
        run: npx turbo run test build --filter=api

  build-and-publish:
    name: Build and publish API image
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}
      api_image: ${{ steps.vars.outputs.api_image }}
    steps:
      - name: Resolve commit and image references
        id: vars
        run: |
          SHA="${{ github.sha }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${REPO_LOWER}-api" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.api_image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.api_image }}:latest

  deploy:
    name: Deploy API to production VPS
    needs: build-and-publish
    runs-on: ubuntu-latest
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Check out deployment definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Copy Compose configuration
        run: |
          scp -P "${{ secrets.SSH_PORT || 22 }}" docker/compose.prod.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/tournament-manager/compose.prod.yml"

      - name: Back up production MySQL
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' << 'EOF'
            set -euo pipefail
            cd /opt/tournament-manager
            mkdir -p backups
            if docker compose -f compose.prod.yml ps --services --filter "status=running" | grep -q "^db$"; then
              set -a && source .env && set +a
              BACKUP_FILE="backups/mysql_backup_$(date +%Y%m%d_%H%M%S).sql"
              echo "Creating database backup: $BACKUP_FILE"
              docker compose -f compose.prod.yml exec -T db mysqldump -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" > "$BACKUP_FILE"
              echo "Database backup complete."
            else
              echo "Database container not currently running; skipping initial backup."
            fi
          EOF

      - name: Apply Prisma migrations and update API image
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          RELEASE_SHA: ${{ needs.build-and-publish.outputs.image_tag }}
          API_IMAGE: ${{ needs.build-and-publish.outputs.api_image }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -se" << EOF
            set -euo pipefail
            cd /opt/tournament-manager

            # Record previous API image tag for rollback
            PREV_API_SHA=\$(grep '^API_IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || true)
            echo "PREV_API_IMAGE_TAG=\${PREV_API_SHA}" > .deploy_state_api

            # Set new API image configuration
            sed -i.bak '/^API_IMAGE=/d' .env || true
            sed -i.bak '/^API_IMAGE_TAG=/d' .env || true
            rm -f .env.bak

            echo "API_IMAGE=$API_IMAGE" >> .env
            echo "API_IMAGE_TAG=$RELEASE_SHA" >> .env

            # Pull new API image and ensure db is ready
            docker compose -f compose.prod.yml pull api
            docker compose -f compose.prod.yml up -d db
            echo "Waiting for db to be healthy..."
            until [ "\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose -f compose.prod.yml ps -q db 2>/dev/null) 2>/dev/null)" = "healthy" ]; do
              sleep 2
            done

            echo "Applying Prisma migrations from new API image..."
            docker compose -f compose.prod.yml run --rm api npm run --workspace=api prisma:deploy

            echo "Starting updated API service..."
            docker compose -f compose.prod.yml up -d --no-deps api
          EOF

      - name: Verify API health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' << 'EOF'
            set -euo pipefail
            cd /opt/tournament-manager

            echo "Verifying API health..."
            SUCCESS=0
            for i in $(seq 1 30); do
              API_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f compose.prod.yml ps -q api 2>/dev/null) 2>/dev/null || echo "unhealthy")
              if [ "$API_HEALTH" = "healthy" ]; then
                echo "API service healthy: $API_HEALTH"
                SUCCESS=1
                break
              fi
              sleep 2
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "API health check failed! Rolling back API to previous release..."
              if [ -f .deploy_state_api ]; then
                source .deploy_state_api
                if [ -n "${PREV_API_IMAGE_TAG:-}" ]; then
                  sed -i.bak '/^API_IMAGE_TAG=/d' .env || true
                  echo "API_IMAGE_TAG=$PREV_API_IMAGE_TAG" >> .env
                  rm -f .env.bak
                  docker compose -f compose.prod.yml up -d --no-deps api
                  echo "Rollback to $PREV_API_IMAGE_TAG complete."
                fi
              fi
              exit 1
            fi
            echo "API deployment successful."
          EOF
