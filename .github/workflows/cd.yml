name: Deploy to Production (VPS)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Servicios a desplegar'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'api'
          - 'web'

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect-targets:
    name: Detect deployment targets
    runs-on: ubuntu-latest
    outputs:
      build_api: ${{ steps.detect.outputs.build_api }}
      build_web: ${{ steps.detect.outputs.build_web }}
      api_image: ${{ steps.detect.outputs.api_image }}
      web_image: ${{ steps.detect.outputs.web_image }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine targets to build and deploy
        id: detect
        run: |
          SHA="${{ github.sha }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${REPO_LOWER}-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${REPO_LOWER}-web" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
            echo "Manual execution for target: $TARGET"
            if [ "$TARGET" = "both" ]; then
              echo "build_api=true" >> "$GITHUB_OUTPUT"
              echo "build_web=true" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "api" ]; then
              echo "build_api=true" >> "$GITHUB_OUTPUT"
              echo "build_web=false" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "web" ]; then
              echo "build_api=false" >> "$GITHUB_OUTPUT"
              echo "build_web=true" >> "$GITHUB_OUTPUT"
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
            echo "Changed files detected:"
            echo "$CHANGED"

            BUILD_API=false
            BUILD_WEB=false

            if echo "$CHANGED" | grep -qE '^(package\.json|package-lock\.json|turbo\.json|docker/|\.github/workflows/cd\.yml)'; then
              BUILD_API=true
              BUILD_WEB=true
            else
              if echo "$CHANGED" | grep -q '^apps/api/'; then
                BUILD_API=true
              fi
              if echo "$CHANGED" | grep -q '^apps/web/'; then
                BUILD_WEB=true
              fi
            fi

            # Fallback if no files matched
            if [ "$BUILD_API" = "false" ] && [ "$BUILD_WEB" = "false" ]; then
              BUILD_API=true
              BUILD_WEB=true
            fi

            echo "Target API: $BUILD_API"
            echo "Target Web: $BUILD_WEB"
            echo "build_api=$BUILD_API" >> "$GITHUB_OUTPUT"
            echo "build_web=$BUILD_WEB" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish container images
    needs: detect-targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-targets.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        if: ${{ needs.detect-targets.outputs.build_api == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ needs.detect-targets.outputs.api_image }}:${{ needs.detect-targets.outputs.sha }}
            ${{ needs.detect-targets.outputs.api_image }}:latest

      - name: Build and publish Web image
        if: ${{ needs.detect-targets.outputs.build_web == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ needs.detect-targets.outputs.web_image }}:${{ needs.detect-targets.outputs.sha }}
            ${{ needs.detect-targets.outputs.web_image }}:latest

  deploy:
    name: Deploy to production VPS
    needs: [detect-targets, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Copy Compose configuration
        run: |
          scp -P "${{ secrets.SSH_PORT || 22 }}" docker/compose.prod.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/tournament-manager/compose.prod.yml"

      - name: Deploy application release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_API: ${{ needs.detect-targets.outputs.build_api }}
          DEPLOY_WEB: ${{ needs.detect-targets.outputs.build_web }}
          API_IMAGE: ${{ needs.detect-targets.outputs.api_image }}
          WEB_IMAGE: ${{ needs.detect-targets.outputs.web_image }}
          RELEASE_SHA: ${{ needs.detect-targets.outputs.sha }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -se" << EOF
            set -euo pipefail
            cd /opt/tournament-manager

            echo "Starting deployment (API: $DEPLOY_API, Web: $DEPLOY_WEB)..."

            # 1. API Deployment
            if [ "$DEPLOY_API" = "true" ]; then
              mkdir -p backups
              if docker compose -f compose.prod.yml ps --services --filter "status=running" | grep -q "^db$"; then
                set -a && source .env && set +a
                BACKUP_FILE="backups/mysql_backup_\$(date +%Y%m%d_%H%M%S).sql"
                echo "Creating database backup: \$BACKUP_FILE"
                docker compose -f compose.prod.yml exec -T db mysqldump -u root -p"\$MYSQL_ROOT_PASSWORD" "\$MYSQL_DATABASE" > "\$BACKUP_FILE"
                echo "Database backup complete."
              else
                echo "Database container not currently running; skipping initial backup."
              fi

              # Save previous API tag for rollback
              PREV_API_SHA=\$(grep '^API_IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || true)
              echo "PREV_API_IMAGE_TAG=\${PREV_API_SHA}" > .deploy_state_api

              sed -i.bak '/^API_IMAGE=/d' .env || true
              sed -i.bak '/^API_IMAGE_TAG=/d' .env || true
              rm -f .env.bak
              echo "API_IMAGE=$API_IMAGE" >> .env
              echo "API_IMAGE_TAG=$RELEASE_SHA" >> .env

              docker compose -f compose.prod.yml pull api
              docker compose -f compose.prod.yml up -d db
              echo "Waiting for db to be healthy..."
              until [ "\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose -f compose.prod.yml ps -q db 2>/dev/null) 2>/dev/null)" = "healthy" ]; do
                sleep 2
              done

              echo "Applying Prisma migrations..."
              docker compose -f compose.prod.yml run --rm api npm run --workspace=api prisma:deploy

              echo "Starting updated API service..."
              docker compose -f compose.prod.yml up -d --no-deps api
            fi

            # 2. Web Deployment
            if [ "$DEPLOY_WEB" = "true" ]; then
              PREV_WEB_SHA=\$(grep '^WEB_IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || true)
              echo "PREV_WEB_IMAGE_TAG=\${PREV_WEB_SHA}" > .deploy_state_web

              sed -i.bak '/^WEB_IMAGE=/d' .env || true
              sed -i.bak '/^WEB_IMAGE_TAG=/d' .env || true
              rm -f .env.bak
              echo "WEB_IMAGE=$WEB_IMAGE" >> .env
              echo "WEB_IMAGE_TAG=$RELEASE_SHA" >> .env

              docker compose -f compose.prod.yml pull web

              echo "Starting updated Web service..."
              docker compose -f compose.prod.yml up -d --no-deps web
            fi

            # 3. Health checks and verification
            echo "Verifying health checks..."
            SUCCESS=1

            if [ "$DEPLOY_API" = "true" ]; then
              API_SUCCESS=0
              for i in \$(seq 1 30); do
                API_HEALTH=\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose -f compose.prod.yml ps -q api 2>/dev/null) 2>/dev/null || echo "unhealthy")
                if [ "\$API_HEALTH" = "healthy" ]; then
                  echo "API healthy."
                  API_SUCCESS=1
                  break
                fi
                sleep 2
              done
              if [ "\$API_SUCCESS" -ne 1 ]; then
                echo "API health check failed!"
                SUCCESS=0
              fi
            fi

            if [ "$DEPLOY_WEB" = "true" ]; then
              WEB_SUCCESS=0
              for i in \$(seq 1 30); do
                WEB_HEALTH=\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose -f compose.prod.yml ps -q web 2>/dev/null) 2>/dev/null || echo "unhealthy")
                if [ "\$WEB_HEALTH" = "healthy" ]; then
                  echo "Web healthy."
                  WEB_SUCCESS=1
                  break
                fi
                sleep 2
              done
              if [ "\$WEB_SUCCESS" -ne 1 ]; then
                echo "Web health check failed!"
                SUCCESS=0
              fi
            fi

            # 4. Rollback if any check failed
            if [ "\$SUCCESS" -ne 1 ]; then
              echo "Health checks failed! Executing rollback..."
              if [ "$DEPLOY_API" = "true" ] && [ -f .deploy_state_api ]; then
                source .deploy_state_api
                if [ -n "\${PREV_API_IMAGE_TAG:-}" ]; then
                  sed -i.bak '/^API_IMAGE_TAG=/d' .env || true
                  echo "API_IMAGE_TAG=\$PREV_API_IMAGE_TAG" >> .env
                  rm -f .env.bak
                  docker compose -f compose.prod.yml up -d --no-deps api
                  echo "API rolled back to \$PREV_API_IMAGE_TAG."
                fi
              fi

              if [ "$DEPLOY_WEB" = "true" ] && [ -f .deploy_state_web ]; then
                source .deploy_state_web
                if [ -n "\${PREV_WEB_IMAGE_TAG:-}" ]; then
                  sed -i.bak '/^WEB_IMAGE_TAG=/d' .env || true
                  echo "WEB_IMAGE_TAG=\$PREV_WEB_IMAGE_TAG" >> .env
                  rm -f .env.bak
                  docker compose -f compose.prod.yml up -d --no-deps web
                  echo "Web rolled back to \$PREV_WEB_IMAGE_TAG."
                fi
              fi
              exit 1
            fi

            echo "Production deployment completed successfully."
          EOF
