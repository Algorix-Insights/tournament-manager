name: Deploy Tournament Manager to production VPS

on:
  workflow_run:
    workflows: ["Validate affected API and web workspaces"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish application images
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}
      api_image: ${{ steps.vars.outputs.api_image }}
      web_image: ${{ steps.vars.outputs.web_image }}
    steps:
      - name: Resolve commit and image references
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${REPO_LOWER}-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${REPO_LOWER}-web" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.api_image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.api_image }}:latest

      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.web_image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.web_image }}:latest

  deploy:
    name: Deploy to production VPS
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Copy Compose configuration
        run: |
          scp -P "${{ secrets.SSH_PORT || 22 }}" deploy/compose.prod.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/tournament-manager/compose.prod.yml"

      - name: Back up production MySQL
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' << 'EOF'
            set -euo pipefail
            cd /opt/tournament-manager
            mkdir -p backups
            if docker compose -f compose.prod.yml ps --services --filter "status=running" | grep -q "^db$"; then
              set -a && source .env && set +a
              BACKUP_FILE="backups/mysql_backup_$(date +%Y%m%d_%H%M%S).sql"
              echo "Creating database backup: $BACKUP_FILE"
              docker compose -f compose.prod.yml exec -T db mysqldump -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" > "$BACKUP_FILE"
              echo "Database backup complete."
            else
              echo "Database container not currently running; skipping initial backup."
            fi
          EOF

      - name: Apply Prisma migrations
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          RELEASE_SHA: ${{ needs.build-and-publish.outputs.image_tag }}
          API_IMAGE: ${{ needs.build-and-publish.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-and-publish.outputs.web_image }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -se" << EOF
            set -euo pipefail
            cd /opt/tournament-manager

            # Record previous SHA for rollback
            PREV_SHA=\$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d'=' -f2- || true)
            echo "PREV_IMAGE_TAG=\${PREV_SHA}" > .deploy_state

            # Set new image configuration
            sed -i.bak '/^API_IMAGE=/d' .env || true
            sed -i.bak '/^WEB_IMAGE=/d' .env || true
            sed -i.bak '/^IMAGE_TAG=/d' .env || true
            rm -f .env.bak

            echo "API_IMAGE=$API_IMAGE" >> .env
            echo "WEB_IMAGE=$WEB_IMAGE" >> .env
            echo "IMAGE_TAG=$RELEASE_SHA" >> .env

            # Pull images and run database migration
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d db
            echo "Waiting for db to be healthy..."
            until [ "\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose -f compose.prod.yml ps -q db 2>/dev/null) 2>/dev/null)" = "healthy" ]; do
              sleep 2
            done

            echo "Applying Prisma migrations from new API image..."
            docker compose -f compose.prod.yml run --rm api npm run --workspace=api prisma:deploy
          EOF

      - name: Start production services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' << 'EOF'
            set -euo pipefail
            cd /opt/tournament-manager
            docker compose -f compose.prod.yml up -d --remove-orphans
          EOF

      - name: Verify production health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' << 'EOF'
            set -euo pipefail
            cd /opt/tournament-manager

            echo "Verifying health checks..."
            SUCCESS=0
            for i in $(seq 1 30); do
              API_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f compose.prod.yml ps -q api 2>/dev/null) 2>/dev/null || echo "unhealthy")
              WEB_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f compose.prod.yml ps -q web 2>/dev/null) 2>/dev/null || echo "unhealthy")
              if [ "$API_HEALTH" = "healthy" ] && [ "$WEB_HEALTH" = "healthy" ]; then
                echo "Services healthy: api=$API_HEALTH, web=$WEB_HEALTH"
                SUCCESS=1
                break
              fi
              sleep 2
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "Health checks failed! Rolling back to previous release..."
              if [ -f .deploy_state ]; then
                source .deploy_state
                if [ -n "${PREV_IMAGE_TAG:-}" ]; then
                  sed -i.bak '/^IMAGE_TAG=/d' .env || true
                  echo "IMAGE_TAG=$PREV_IMAGE_TAG" >> .env
                  rm -f .env.bak
                  docker compose -f compose.prod.yml up -d --remove-orphans
                  echo "Rollback to $PREV_IMAGE_TAG complete."
                fi
              fi
              exit 1
            fi
            echo "Production deployment successful."
          EOF
